name: Release skills

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time, never cancelled half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository with its tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Use the pinned Node.js version
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the build tooling
        run: npm run setup

      - name: Release every plugin whose skills changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-plugins.mjs
