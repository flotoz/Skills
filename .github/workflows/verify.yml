name: Verify skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Use the pinned Node.js version
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the quality tooling
        run: npm run setup

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          echo "$PR_TITLE" | npx commitlint --verbose

      - name: Skills and plugins follow the repository rules
        run: npm run verify:rules

      - name: Docs are well formatted
        run: npm run verify:docs

      - name: Claude Code accepts the marketplace, plugins and skills
        run: npm run verify:plugins

      - name: Mock MCP servers answer
        run: |
          for f in plugins/*/evals/mock-*.mjs; do
            fixture="$(ls "$(dirname "$f")"/fixtures/*.json | head -1)"
            echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node "$f" "$fixture" | grep -q '"tools"'
          done
          for s in plugins/*/evals/*.sh plugins/*/install.sh install.sh; do bash -n "$s"; done

      - name: The installer puts every skill in place
        run: |
          bash install.sh --list
          HOME="$RUNNER_TEMP/home" bash install.sh --agent all
          for skill in plugins/*/skills/*/; do
            test -f "$RUNNER_TEMP/home/.claude/skills/$(basename "$skill")/SKILL.md"
            test -f "$RUNNER_TEMP/home/.claude/skills/$(basename "$skill")/LICENSE.txt"
          done

      - name: Each plugin installer installs only its own skills, into .agents by default
        run: |
          for plugin in plugins/*/; do
            home="$RUNNER_TEMP/home-$(basename "$plugin")"
            HOME="$home" bash "$plugin/install.sh"
            expected="$(ls "$plugin/skills" | sort)"
            test "$expected" = "$(ls "$home/.agents/skills" | sort)"
          done

      - name: The default install adds Claude Code when it is detected
        run: |
          home="$RUNNER_TEMP/home-claude"
          mkdir -p "$home/.claude"
          HOME="$home" bash install.sh
          for skill in plugins/*/skills/*/; do
            test -f "$home/.agents/skills/$(basename "$skill")/SKILL.md"
            test -f "$home/.claude/skills/$(basename "$skill")/SKILL.md"
          done

  installers:
    name: Installers on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the repository
        uses: actions/checkout@v7.0.1

      - name: install.sh with the default bash
        shell: bash
        run: bash scripts/test-installers.sh --remote

      - name: install.sh with macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        shell: bash
        run: BASH_UNDER_TEST=/bin/bash /bin/bash scripts/test-installers.sh --remote

      - name: install.ps1 with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installers.ps1

      - name: install.ps1 with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-installers.ps1
