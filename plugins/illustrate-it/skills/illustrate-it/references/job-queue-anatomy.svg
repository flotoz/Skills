<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" role="img" aria-labelledby="jobQueueTitle jobQueueDesc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="jobQueueTitle">Job queue layers</title>
  <desc id="jobQueueDesc">Three layers: the API submits a job to the runner, the runner writes the result to the job table and updates the status, or the watchdog times the job out.</desc>
  <defs>
    <marker id="arrowHead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="528" height="88" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
  <text x="32" y="65" font-size="14" font-weight="600" fill="#334155">API</text>
  <rect x="176" y="36" width="160" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="256" y="65" font-size="14" fill="#0C4A6E" text-anchor="middle">Submit job</text>
  <rect x="368" y="36" width="160" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="448" y="65" font-size="14" fill="#14532D" text-anchor="middle">Job status</text>

  <rect x="16" y="128" width="528" height="88" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
  <text x="32" y="177" font-size="14" font-weight="600" fill="#334155">Workers</text>
  <rect x="176" y="148" width="160" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="4"/>
  <text x="256" y="177" font-size="14" font-weight="600" fill="#0C4A6E" text-anchor="middle">Job runner</text>
  <rect x="368" y="148" width="160" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="448" y="177" font-size="14" fill="#0C4A6E" text-anchor="middle">Watchdog</text>

  <rect x="16" y="240" width="528" height="88" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
  <text x="32" y="289" font-size="14" font-weight="600" fill="#334155">Storage</text>
  <rect x="176" y="260" width="160" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="256" y="289" font-size="14" fill="#0C4A6E" text-anchor="middle">Job table</text>

  <line x1="256" y1="84" x2="256" y2="146" stroke="#64748B" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="256" y1="196" x2="256" y2="258" stroke="#64748B" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="448" y1="148" x2="448" y2="86" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowHead)"/>
  <path d="M336 172 H352 V60 H366" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrowHead)"/>

  <circle cx="280" cy="116" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="280" y="120" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">1</text>
  <circle cx="280" cy="228" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="280" y="232" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">2</text>
  <circle cx="376" cy="116" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="376" y="120" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">3</text>
  <circle cx="472" cy="116" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="472" y="120" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">4</text>
</svg>
